<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Assignment 4</title></head>
<body>
  <!-- Semantic layout -->
  <header><h1>College Portal</h1></header>
  <nav><a href="#">Home</a> | <a href="#">Courses</a></nav>
  <main>
    <section>
      <h2>Admission Open</h2>
      <p>Apply before 30 June.</p>
    </section>
    <aside>Notice: Library closed Sunday.</aside>
  </main>
  <footer>&copy; 2026 College</footer>

  <!-- Non-semantic (div) version of the same layout, for comparison:
  <div id="header"><h1>College Portal</h1></div>
  <div id="nav"><a href="#">Home</a> | <a href="#">Courses</a></div>
  <div id="main">
    <div class="section"><h2>Admission Open</h2><p>Apply before 30 June.</p></div>
    <div class="aside">Notice: Library closed Sunday.</div>
  </div>
  <div id="footer">&copy; 2026 College</div>
  Divs say nothing about their purpose; header/nav/main/section/aside/footer
  tell browsers, search engines and screen readers what each part is. -->
</body>
</html>
