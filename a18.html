<!DOCTYPE html>
<html lang="en">
<head>

  <style>

    header, footer { background: #1a237e; color: #fff; text-align: center; }

    main { max-width: 560px; margin: 0 auto; padding: 10px 0; }
    table { border-collapse: collapse; width: 100%; margin-bottom: 15px; }
    th, td { border: 1px solid #999; padding: 6px; text-align: left; }

<body>
  <header><h1>ABC College Admission 2026</h1></header>
  <main>
    <section>
      <h2>Courses and Fees</h2>

        <caption>Available Courses</caption>
        <thead><tr><th>Course</th><th>Seats</th><th>Fees</th></tr></thead>
